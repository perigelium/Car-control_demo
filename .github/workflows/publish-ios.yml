name: Publish iOS Binary Manually

on:
  workflow_dispatch:
  push:
    branches:
      - main
    #paths:
    #  - 'sharedUI/**'

jobs:
  build-and-publish:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      # 1. Build the XCFramework
      - name: Build XCFramework
        run: ./gradlew :sharedUI:assembleSharedUIReleaseXCFramework --no-daemon --build-cache -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      # 2. Zip the framework
      - name: Zip Framework
        run: |
          cd sharedUI/build/XCFrameworks/release
          # Zips clean inside the folder but saves the resulting binary back into the repository root
          zip -r "$GITHUB_WORKSPACE/sharedUI.xcframework.zip" sharedUI.xcframework 
          cd "$GITHUB_WORKSPACE"

      # 3. Calculate the SHA-256 Checksum
      - name: Calculate Checksum
        id: checksum
        run: |
          SHASUM=$(swift package compute-checksum sharedUI.xcframework.zip)
          # FIX: Correctly exports the variable value to downstream steps
          echo "checksum=$SHASUM" >> $GITHUB_OUTPUT
          echo "Calculated Checksum: $SHASUM"

      # 4. Upload the zip file to GitHub Releases
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: sharedUI.xcframework.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Update your Package.swift
      - name: Update Package.swift
        run: |
          # FIX: Fixed the malformed repository path interpolation
          RELEASE_URL="https://github.com{{ github.repository }}/releases/download/v${{ github.run_number }}/sharedUI.xcframework.zip"
          CHECKSUM="${{ steps.checksum.outputs.checksum }}"
          
          sed -i '' -E "s|[[:space:]]*url: \"[^\"]+\"|            url: \"$RELEASE_URL\"|g" Package.swift
          sed -i '' -E "s|[[:space:]]*checksum: \"[^\"]+\"|            checksum: \"$CHECKSUM\"|g" Package.swift

      # 6. Commit the updated Package.swift (FIXED INFINITE LOOP BUG)
      - name: Commit and Push Package.swift
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add Package.swift
          
          # Added [skip ci] to prevent this commit from triggering a duplicate workflow loop
          git commit -m "chore: update iOS binary to v${{ github.run_number }} [skip ci]"
          git push origin main

